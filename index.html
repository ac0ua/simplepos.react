    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Roboto', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        gap: 24px;
      }
      
      .loading-icon-container {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loading-icon {
        font-family: 'Material Symbols Outlined';
        font-size: 80px;
        color: white;
        position: absolute;
        opacity: 0;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        animation: slideIcon 7.5s ease-in-out infinite;
      }
      
      .loading-icon:nth-child(1) {
        animation-delay: 0s;
      }
      
      .loading-icon:nth-child(2) {
        animation-delay: 1.5s;
      }
      
      .loading-icon:nth-child(3) {
        animation-delay: 3s;
      }
      
      .loading-icon:nth-child(4) {
        animation-delay: 4.5s;
      }
      
      .loading-icon:nth-child(5) {
        animation-delay: 6s;
      }
      
      .loading-bg-circle {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        animation: pulse 2s ease-in-out infinite;
      }
      
      .loading-text {
        color: white;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      
      .loading-dots {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      
      .loading-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        animation: dotPulse 1.5s ease-in-out infinite;
      }
      
      .loading-dot:nth-child(1) {
        animation-delay: 0s;
      }
      
      .loading-dot:nth-child(2) {
        animation-delay: 0.3s;
      }
      
      .loading-dot:nth-child(3) {
        animation-delay: 0.6s;
      }
      
      @keyframes slideIcon {
        0% {
          transform: translateX(-150px) rotate(-45deg) scale(0.5);
          opacity: 0;
        }
        10% {
          transform: translateX(0) rotate(0deg) scale(1);
          opacity: 1;
        }
        20% {
          transform: translateX(0) rotate(0deg) scale(1);
          opacity: 1;
        }
        30% {
          transform: translateX(150px) rotate(45deg) scale(0.5);
          opacity: 0;
        }
        100% {
          transform: translateX(150px) rotate(45deg) scale(0.5);
          opacity: 0;
        }
      }
      
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.2;
        }
      }
      
      @keyframes dotPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.5);
          opacity: 1;
        }
      }
    </style>

  <body>
    <div id="root">
      <div class="loading-container">

          <span class="loading-icon">local_pizza</span>
          <span class="loading-icon">fastfood</span>
          <span class="loading-icon">local_drink</span>
          <span class="loading-icon">cake</span>

        </div>
      </div>
